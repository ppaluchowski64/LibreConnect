buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def findLibreConnectVersionFile = { File startDir ->
    File currentDir = startDir
    while (currentDir != null) {
        File candidate = new File(currentDir, "VERSION")
        if (candidate.exists()) {
            return candidate
        }
        currentDir = currentDir.parentFile
    }
    return null
}

def libreConnectVersionFile = findLibreConnectVersionFile(projectDir)
if (libreConnectVersionFile == null) {
    throw new GradleException("VERSION file not found from Gradle project directory '${projectDir}'")
}
def libreConnectVersion = libreConnectVersionFile.text.trim()
if (!(libreConnectVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("VERSION must contain a numeric x.y.z version, got '${libreConnectVersion}'")
}
def libreConnectVersionParts = libreConnectVersion.tokenize('.').collect { it as int }
def libreConnectVersionCode = libreConnectVersionParts[0] * 10000 +
        libreConnectVersionParts[1] * 100 +
        libreConnectVersionParts[2]

android {
    compileSdk 34
    namespace "com.LibreConnect.mobile"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        applicationId "com.LibreConnect.mobile"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode libreConnectVersionCode
        versionName libreConnectVersion
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
