name: Build Ubuntu

on:
  workflow_call:

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Homebrew
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            libasound2-dev

          NONINTERACTIVE=1 /bin/bash -c \
          "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          echo "/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH

      - name: Verify Brew
        run: brew --version

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Set Conan Env
        shell: bash
        run: |
          CONAN_VERSION=$(conan --version | grep -oP '\d+\.\d+\.\d+')
          echo "CONAN_VERSION=$CONAN_VERSION" >> $GITHUB_ENV

      - name: Cache Conan Packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: qtmultimedia

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Write Qt path to .env for CMake
        run: |
          echo "QT_DIR_DESKTOP=$QT_ROOT_DIR" >> .env
          echo "DISABLE_DEBUG=true" >> .env
          echo "BUILD_FOR=Desktop" >> .env
          echo "BUILD_TESTS=true" >> .env

      - name: Install Conan deps
        run: python configure_project.py

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Create self-contained Qt bundle
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_DIR=$(find build -type d -name appLibreConnect_desktop | head -n1)

          if [[ -z "$DEPLOY_DIR" ]]; then
            echo "Deploy dir not found!"
            exit 1
          fi

          echo "Using deploy dir: $DEPLOY_DIR"

          mkdir -p "$DEPLOY_DIR/usr/lib"
          mkdir -p "$DEPLOY_DIR/usr/plugins"
          mkdir -p "$DEPLOY_DIR/usr/qml"
          mkdir -p "$DEPLOY_DIR/usr/translations"

          echo "Copying Qt libraries (.so)..."
          find "$QT_ROOT_DIR" -name "libQt6*.so*" -exec cp -a {} "$DEPLOY_DIR/usr/lib/" \;

          echo "Copying plugins..."
          if [[ -d "$QT_ROOT_DIR/plugins" ]]; then
            cp -a "$QT_ROOT_DIR/plugins/." "$DEPLOY_DIR/usr/plugins/"
          fi

          echo "Copying QML..."
          if [[ -d "$QT_ROOT_DIR/qml" ]]; then
            cp -a "$QT_ROOT_DIR/qml/." "$DEPLOY_DIR/usr/qml/"
          fi

          echo "Copying translations..."
          if [[ -d "$QT_ROOT_DIR/translations" ]]; then
            cp -a "$QT_ROOT_DIR/translations/." "$DEPLOY_DIR/usr/translations/"
          fi

          echo "Creating run script..."
          cat > "$DEPLOY_DIR/run.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/usr/plugins"
          export QML2_IMPORT_PATH="$DIR/usr/qml"
          "$DIR/usr/bin/LibreConnect"
          EOF

          chmod +x "$DEPLOY_DIR/run.sh"

      - name: Construct deployed application
        run: |
          mkdir deployed-application
          cp -r build/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop/* deployed-application/

      - name: Read package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION file is empty." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload deployed application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-application-Ubuntu-Latest
          path: deployed-application

      - name: Upload build directory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-dir-Ubuntu-Latest
          path: build

      - name: Create Ubuntu installer
        shell: bash
        run: |
          set -euo pipefail
          bash installers/linux/build-installer.sh \
            --deploy-dir "$GITHUB_WORKSPACE/build/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop" \
            --version "$PACKAGE_VERSION" \
            --output-dir "$GITHUB_WORKSPACE/out/ubuntu" \
            --arch amd64

      - name: Upload Ubuntu installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-Ubuntu
          path: out/ubuntu/*.deb
