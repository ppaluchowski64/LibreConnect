on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Upgrade Git to latest
        run: choco upgrade git -y

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: qtmultimedia

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Write Qt path to .env for CMake
        shell: pwsh
        run: |
          "QT_DIR_DESKTOP=$env:QT_ROOT_DIR" >> .env
          "DISABLE_DEBUG=true" >> .env
          "BUILD_FOR=Desktop" >> .env

      - name: Install Conan deps
        run: python configure_project.py

      - name: Configure CMake
        run: cmake --preset conan-default

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-Windows-Latest
          path: build

  build-ubuntu:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libdbus-1-dev \
          libfontconfig1 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libmysqlclient21 \
          unixodbc \
          unixodbc-dev \
          libpq-dev

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: qtmultimedia

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Write Qt path to .env for CMake
        run: echo QT_DIR_DESKTOP=$QT_ROOT_DIR >> .env && echo DISABLE_DEBUG=true >> .env && echo BUILD_FOR=Desktop >> .env

      - name: Install Conan deps
        run: python configure_project.py

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-Ubuntu-Latest
          path: build

  build-macOS:
    name: Build MacOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: qtmultimedia

      - name: Write Qt path to .env for CMake
        run: echo "QT_DIR_DESKTOP=$QT_ROOT_DIR" >> .env && echo "DISABLE_DEBUG=true" >> .env && echo "BUILD_FOR=Desktop" >> .env

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Install Conan deps
        run: python configure_project.py

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-MacOS-Latest
          path: build
