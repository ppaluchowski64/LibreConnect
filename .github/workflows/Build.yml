on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-windows-latest:
    name: Build Windows-Latest
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Write Qt path to .env for CMake
        run: |
          echo "QT_DIR=C:\Users\runneradmin\Qt\6.8.3\msvc2022_64" >> .env

      - name: Install Conan deps
        run: conan install . --output-folder=build --build=missing -g CMakeToolchain -g CMakeDeps -s compiler.cppstd=20 -s build_type=Release

      - name: Configure CMake
        run: cmake --preset conan-default

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-Windows-Latest
          path: build

  build-ubuntu-latest:
    name: Build Linux-Latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libdbus-1-dev \
          libfontconfig1 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxkbcommon-dev \
          libxkbcommon-x11-dev

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Write Qt path to .env for CMake
        run: |
          echo "QT_DIR=/home/runner/work/_temp/Qt/6.8.3/linux_gcc_64" >> .env

      - name: Install Conan deps
        run: conan install . --output-folder=build --build=missing -g CMakeToolchain -g CMakeDeps -s compiler.cppstd=gnu20 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-Ubuntu-Latest
          path: build

  build-macOS-latest:
    name: Build MacOS-Latest
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Write Qt path to .env for CMake
        run: |
          echo "QT_DIR=/Users/runner/work/_temp/Qt/6.8.3/clang_64" >> .env

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Install Conan deps
        run: conan install . --output-folder=build --build=missing -g CMakeToolchain -g CMakeDeps -s compiler.cppstd=20 -s build_type=Release

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-MacOS-Latest
          path: build