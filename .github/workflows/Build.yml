      - name: Build
        run: cmake --build --preset conan-release

      - name: Create self-contained Qt bundle
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_DIR=$(find build -type d -name appLibreConnect_desktop | head -n1)

          if [[ -z "$DEPLOY_DIR" ]]; then
            echo "Deploy dir not found!"
            exit 1
          fi

          echo "Using deploy dir: $DEPLOY_DIR"

          mkdir -p "$DEPLOY_DIR/usr/lib"
          mkdir -p "$DEPLOY_DIR/usr/plugins"
          mkdir -p "$DEPLOY_DIR/usr/qml"
          mkdir -p "$DEPLOY_DIR/usr/translations"

          echo "Copying Qt libraries (.so)..."
          find "$QT_ROOT_DIR" -name "libQt6*.so*" -exec cp -a {} "$DEPLOY_DIR/usr/lib/" \;

          echo "Copying plugins..."
          if [[ -d "$QT_ROOT_DIR/plugins" ]]; then
            cp -a "$QT_ROOT_DIR/plugins/." "$DEPLOY_DIR/usr/plugins/"
          fi

          echo "Copying QML..."
          if [[ -d "$QT_ROOT_DIR/qml" ]]; then
            cp -a "$QT_ROOT_DIR/qml/." "$DEPLOY_DIR/usr/qml/"
          fi

          echo "Copying translations..."
          if [[ -d "$QT_ROOT_DIR/translations" ]]; then
            cp -a "$QT_ROOT_DIR/translations/." "$DEPLOY_DIR/usr/translations/"
          fi

          echo "Creating run script..."
          cat > "$DEPLOY_DIR/run.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/usr/plugins"
          export QML2_IMPORT_PATH="$DIR/usr/qml"
          "$DIR/appLibreConnect_desktop"
          EOF

          chmod +x "$DEPLOY_DIR/run.sh"

      - name: Construct deployed application
        run: |
          mkdir deployed-application
          cp -r build/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop/* deployed-application/

      - name: Upload deployed application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-application-Ubuntu-ARM-Latest
          path: deployed-application

      - name: Upload build directory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-dir-Ubuntu-ARM-Latest
          path: build

  build-macOS:
    name: Build macOS
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update Homebrew
        run: brew update

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Set Conan Env
        shell: bash
        run: |
          CONAN_VERSION=$(conan --version | sed -E 's/[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "CONAN_VERSION=$CONAN_VERSION" >> "$GITHUB_ENV"

      - name: Cache Conan Packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_VERSION }}

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: qtmultimedia

      - name: Write Qt path to .env for CMake
        run: echo "QT_DIR_DESKTOP=$QT_ROOT_DIR" >> .env && echo "DISABLE_DEBUG=true" >> .env && echo "BUILD_FOR=Desktop" >> .env && echo "BUILD_TESTS=true" >> .env

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Install Conan deps
        run: python configure_project.py

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload deployed application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-application-macOS-Latest
          path: build/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop/appLibreConnect_desktop.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-dir-macOS-Latest
          path: build

  build-android-armv8:
    name: Build Android (armv8)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Set Conan Env
        shell: bash
        run: |
          CONAN_VERSION=$(conan --version | grep -oP '\d+\.\d+\.\d+')
          echo "CONAN_VERSION=$CONAN_VERSION" >> $GITHUB_ENV

      - name: Cache Conan Packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/
          key: Android-armv8-${{ env.CONAN_VERSION }}
          restore-keys: Android-armv8-${{ env.CONAN_VERSION }}

      - name: Install Qt (includes Qt Quick / QML)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: qtmultimedia

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK components
        run: |
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-24" \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;27.3.13750724"

      - name: Write Qt path to .env for CMake
        run: |
          echo "BUILD_FOR=Android" >> .env 
          echo "DISABLE_DEBUG=true" >> .env
          echo "QT_DIR_ANDROID=$QT_ROOT_DIR" >> .env
          echo "ANDROID_NDK_DIR=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> .env
          echo "ANDROID_SDK_DIR=$ANDROID_SDK_ROOT" >> .env
          echo "ANDROID_ARCH=armv8" >> .env
          echo "ANDROID_CLANG_VERSION=18" >> .env
          echo "ANDROID_OS_API_LEVEL=24" >> .env
          echo "BUILD_TESTS=true" >> .env

      - name: Create Conan profile
        run: conan profile detect --force

      - name: Install Conan deps
        run: python configure_project.py

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build CMake
        run: cmake --build --preset conan-release

      - name: Upload deployed application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-application-Android-armv8
          path: build/android/build/Release/apps/mobile/android-build/appLibreConnect_mobile.apk

      - name: Upload build directory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-build-dir-Android-armv8
          path: build
