name: Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to publish into package repositories; use latest by default.
        required: false
        type: string
        default: latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-packages
  cancel-in-progress: false

jobs:
  publish-package-repositories:
    name: Publish Package Repositories
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_GPG_PRIVATE_KEY }}
      PACKAGE_GPG_PASSPHRASE: ${{ secrets.PACKAGE_GPG_PASSPHRASE }}
      FDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      FDROID_KEY_ALIAS: libreconnect
      GNUPGHOME: ${{ github.workspace }}/.gnupg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            createrepo-c \
            dpkg-dev \
            fdroidserver \
            gnupg \
            jq \
            pacman-package-manager \
            rpm \
            xz-utils

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a index.html site/index.html
          if [[ -f CNAME ]]; then
            cp -a CNAME site/CNAME
          fi

      - name: Fetch latest Release installers
        shell: bash
        run: bash packages/fetch-release-assets.sh "${{ inputs.release_tag }}" release-assets

      - name: Generate F-Droid repository
        shell: bash
        run: bash packages/generate-fdroid-repo.sh release-assets site

      - name: Generate APT repository
        shell: bash
        run: bash packages/generate-apt-repo.sh release-assets site

      - name: Generate DNF repository
        shell: bash
        run: bash packages/generate-dnf-repo.sh release-assets site

      - name: Generate Pacman repository
        shell: bash
        run: bash packages/generate-pacman-repo.sh release-assets site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
