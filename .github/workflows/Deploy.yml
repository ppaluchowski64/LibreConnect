name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in installer filenames (example 1.2.3)
        required: true
        type: string
      release_name:
        description: GitHub Release title
        required: true
        type: string
      release_description:
        description: Optional GitHub Release description (prepended before generated notes)
        required: false
        type: string
        default: ''
      commit_sha:
        description: Commit SHA that already has successful Build.yml artifacts
        required: true
        type: string
      draft:
        description: Create release as draft
        required: true
        type: boolean
        default: true
      prerelease:
        description: Mark release as prerelease
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  resolve-build-run:
    name: Resolve Build Run
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.find_run.outputs.run_id }}
    steps:
      - name: Find successful Build workflow run for commit
        id: find_run
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "Build.yml";
            const commitInput = process.env.COMMIT_SHA.trim().toLowerCase();
            const fullShaRegex = /^[0-9a-f]{40}$/;

            let page = 1;
            let selectedRun = null;

            while (page <= 10 && !selectedRun) {
              const params = {
                owner,
                repo,
                workflow_id,
                per_page: 100,
                page
              };
              if (fullShaRegex.test(commitInput)) {
                params.head_sha = commitInput;
              }

              const result = await github.rest.actions.listWorkflowRuns(params);

              for (const run of result.data.workflow_runs) {
                const shaMatches = fullShaRegex.test(commitInput)
                  ? run.head_sha === commitInput
                  : run.head_sha.startsWith(commitInput);
                if (shaMatches && run.status === "completed" && run.conclusion === "success") {
                  selectedRun = run;
                  break;
                }
              }

              if (result.data.workflow_runs.length < 100) {
                break;
              }
              page += 1;
            }

            if (!selectedRun) {
              core.setFailed(`No successful Build.yml run found for commit ${commitInput}.`);
              return;
            }

            core.info(`Using Build run ID ${selectedRun.id} (${selectedRun.html_url})`);
            core.setOutput("run_id", String(selectedRun.id));

  package-android:
    name: Package Android APK
    runs-on: ubuntu-24.04
    needs: resolve-build-run
    steps:
      - name: Download Android build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build-run.outputs.run_id }}
          pattern: '*-build-application-Android-armv8'
          path: artifacts/android
          merge-multiple: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install "build-tools;34.0.0"

      - name: Sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          for required_var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "Missing required secret: ${required_var}" >&2
              exit 1
            fi
          done

          UNSIGNED_APK="$(find artifacts/android -type f -name '*.apk' | head -n1)"
          if [[ -z "${UNSIGNED_APK}" ]]; then
            echo "No APK found in artifacts/android." >&2
            find artifacts/android -maxdepth 6 -type f | sort
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS="${SDK_ROOT}/build-tools/34.0.0"
          if [[ ! -x "${BUILD_TOOLS}/apksigner" || ! -x "${BUILD_TOOLS}/zipalign" ]]; then
            echo "apksigner/zipalign not found in ${BUILD_TOOLS}" >&2
            exit 1
          fi

          mkdir -p out/android

          KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          ALIGNED_APK="${RUNNER_TEMP}/app-aligned.apk"
          SIGNED_APK="${GITHUB_WORKSPACE}/out/android/LibreConnect-${{ inputs.version }}-arm64-v8a.apk"

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"

          "${BUILD_TOOLS}/zipalign" -f 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-key-alias libreconnect \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${SIGNED_APK}"

      - name: Upload signed Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-Android
          path: out/android/*.apk

  package-windows:
    name: Package Windows Installer
    runs-on: windows-2025
    needs: resolve-build-run
    steps:
      - name: Checkout repository at target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build-run.outputs.run_id }}
          pattern: '*-build-dir-Windows-Latest'
          path: artifacts/windows
          merge-multiple: true

      - name: Install WiX CLI
        shell: powershell
        run: |
          $toolPath = "$env:USERPROFILE\.dotnet\tools"
          $env:PATH = "$toolPath;$env:PATH"
          "$toolPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          dotnet tool install --global wix --version 6.*
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global wix
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install or update WiX .NET tool."
            }
          }

          wix extension add --global WixToolset.UI.wixext
          wix extension add --global WixToolset.Util.wixext
          
          & "$toolPath\wix.exe" --version

      - name: Find deploy directory
        shell: powershell
        run: |
          $deployDir = Get-ChildItem -Path artifacts/windows -Recurse -Directory -Filter appLibreConnect_desktop | Select-Object -First 1 -ExpandProperty FullName
          if (-not $deployDir) {
            throw "Could not find appLibreConnect_desktop in Windows build artifact."
          }
          "DEPLOY_DIR=$deployDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Windows installer
        shell: powershell
        run: |
          installers/windows/build-installer.ps1 `
            -DeployDir "$env:DEPLOY_DIR" `
            -Version "${{ inputs.version }}" `
            -OutputDir "$env:GITHUB_WORKSPACE\out\windows"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-Windows
          path: out/windows

  package-ubuntu:
    name: Package Ubuntu Installer
    runs-on: ubuntu-24.04
    needs: resolve-build-run
    steps:
      - name: Checkout repository at target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Download Ubuntu build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build-run.outputs.run_id }}
          pattern: '*-build-dir-Ubuntu-Latest'
          path: artifacts/ubuntu
          merge-multiple: true

      - name: Find deploy directory
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR=""
          for candidate in \
            artifacts/ubuntu/build/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop \
            artifacts/ubuntu/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop
          do
            if [[ -d "$candidate" ]]; then
              DEPLOY_DIR="$candidate"
              break
            fi
          done
          if [[ -z "$DEPLOY_DIR" ]]; then
            DEPLOY_DIR="$(find artifacts/ubuntu -type d -name appLibreConnect_desktop | head -n1)"
          fi
          if [[ -z "$DEPLOY_DIR" ]]; then
            echo "Could not find appLibreConnect_desktop in Ubuntu build artifact." >&2
            find artifacts/ubuntu -maxdepth 6 -type d | sort
            exit 1
          fi
          echo "DEPLOY_DIR=$(realpath "$DEPLOY_DIR")" >> "$GITHUB_ENV"

      - name: Create Ubuntu installer
        shell: bash
        run: |
          bash installers/linux/build-installer.sh \
            --deploy-dir "$DEPLOY_DIR" \
            --version "${{ inputs.version }}" \
            --output-dir "$GITHUB_WORKSPACE/out/ubuntu" \
            --arch amd64

      - name: Upload Ubuntu installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-Ubuntu
          path: out/ubuntu

  package-ubuntu-arm:
    name: Package Ubuntu ARM64 Installer
    runs-on: ubuntu-24.04
    needs: resolve-build-run
    steps:
      - name: Checkout repository at target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Download Ubuntu ARM build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build-run.outputs.run_id }}
          pattern: '*-build-dir-Ubuntu-ARM-Latest'
          path: artifacts/ubuntu-arm
          merge-multiple: true

      - name: Find deploy directory
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR=""
          for candidate in \
            artifacts/ubuntu-arm/build/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop \
            artifacts/ubuntu-arm/desktop/Release/build/Release/deploy/Release/appLibreConnect_desktop
          do
            if [[ -d "$candidate" ]]; then
              DEPLOY_DIR="$candidate"
              break
            fi
          done
          if [[ -z "$DEPLOY_DIR" ]]; then
            DEPLOY_DIR="$(find artifacts/ubuntu-arm -type d -name appLibreConnect_desktop | head -n1)"
          fi
          if [[ -z "$DEPLOY_DIR" ]]; then
            echo "Could not find appLibreConnect_desktop in Ubuntu ARM build artifact." >&2
            find artifacts/ubuntu-arm -maxdepth 6 -type d | sort
            exit 1
          fi
          echo "DEPLOY_DIR=$(realpath "$DEPLOY_DIR")" >> "$GITHUB_ENV"

      - name: Create Ubuntu ARM installer
        shell: bash
        run: |
          bash installers/linux/build-installer.sh \
            --deploy-dir "$DEPLOY_DIR" \
            --version "${{ inputs.version }}" \
            --output-dir "$GITHUB_WORKSPACE/out/ubuntu-arm" \
            --arch arm64

      - name: Upload Ubuntu ARM installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-Ubuntu-ARM
          path: out/ubuntu-arm

  package-macos:
    name: Package Macos
    runs-on: ubuntu-24.04
    needs: resolve-build-run
    steps:
      - name: Download Macos build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build-run.outputs.run_id }}
          pattern: '*-build-application-macOS-Latest'
          path: artifacts/macos
          merge-multiple: true

      - name: Prepare macOS installer
        shell: bash
        run: |
          set -euo pipefail

          DMG_PATH="$(find artifacts/macos -type f -name '*.dmg' | head -n1)"
          if [[ -z "$DMG_PATH" ]]; then
            echo "No .dmg found in macOS build artifact." >&2
            find artifacts/macos -maxdepth 6 -type f | sort
            exit 1
          fi

          mkdir -p out/macos
          cp "$DMG_PATH" "out/macos/LibreConnect-${{ inputs.version }}.dmg"

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macOS
          path: out/macos/*.dmg

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - package-windows
      - package-ubuntu
      - package-ubuntu-arm
      - package-android
      - package-macos
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          ls -R release-assets
          test -n "$(find release-assets -type f -name '*.msi' -print -quit)"
          test -n "$(find release-assets -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_description }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.msi
            release-assets/**/*.deb
            release-assets/**/*.apk
            release-assets/**/*.dmg
