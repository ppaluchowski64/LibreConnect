name: Deploy

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      release_name:
        description: GitHub Release title (defaults to vVERSION)
        required: false
        type: string
        default: ''
      release_description:
        description: Optional GitHub Release description (prepended before generated notes)
        required: false
        type: string
        default: ''
      commit_sha:
        description: Commit SHA that already has successful Build.yml artifacts
        required: true
        type: string
      draft:
        description: Create release as draft
        required: false
        type: boolean
        default: true
      prerelease:
        description: Mark release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      should_deploy: ${{ steps.prepare.outputs.should_deploy }}
      version: ${{ steps.prepare.outputs.version }}
      release_name: ${{ steps.prepare.outputs.release_name }}
      release_description: ${{ steps.prepare.outputs.release_description }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
      draft: ${{ steps.prepare.outputs.draft }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}
          fetch-depth: 2

      - name: Prepare release inputs
        id: prepare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_RELEASE_DESCRIPTION: ${{ inputs.release_description }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "VERSION file is missing." >&2
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a numeric x.y.z version, got '$VERSION'." >&2
            exit 1
          fi

          default_release_name="v$VERSION"

          write_output() {
            local name="$1"
            local value="$2"
            local delimiter="EOF_${name}_$RANDOM"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if ! git diff-tree --root --no-commit-id --name-only -r -m "$WORKFLOW_RUN_HEAD_SHA" | grep -qx "VERSION"; then
              echo "VERSION did not change in $WORKFLOW_RUN_HEAD_SHA; skipping automatic draft release."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            write_output "release_name" "$default_release_name"
            write_output "release_description" "Automated draft release for VERSION $VERSION from commit $WORKFLOW_RUN_HEAD_SHA."
            echo "commit_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_name="${INPUT_RELEASE_NAME:-$default_release_name}"

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          write_output "release_name" "$release_name"
          write_output "release_description" "$INPUT_RELEASE_DESCRIPTION"
          echo "commit_sha=$INPUT_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "draft=${INPUT_DRAFT:-true}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${INPUT_PRERELEASE:-false}" >> "$GITHUB_OUTPUT"

  resolve-build-run:
    name: Resolve Build Run
    runs-on: ubuntu-24.04
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.should_deploy == 'true' }}
    outputs:
      run_id: ${{ steps.find_run.outputs.run_id }}
    steps:
      - name: Find successful Build workflow run for commit
        id: find_run
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ needs.prepare-release.outputs.commit_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "Build.yml";
            const commitInput = process.env.COMMIT_SHA.trim().toLowerCase();
            const fullShaRegex = /^[0-9a-f]{40}$/;

            let page = 1;
            let selectedRun = null;

            while (page <= 10 && !selectedRun) {
              const params = {
                owner,
                repo,
                workflow_id,
                per_page: 100,
                page
              };
              if (fullShaRegex.test(commitInput)) {
                params.head_sha = commitInput;
              }

              const result = await github.rest.actions.listWorkflowRuns(params);

              for (const run of result.data.workflow_runs) {
                const shaMatches = fullShaRegex.test(commitInput)
                  ? run.head_sha === commitInput
                  : run.head_sha.startsWith(commitInput);
                if (shaMatches && run.status === "completed" && run.conclusion === "success") {
                  selectedRun = run;
                  break;
                }
              }

              if (result.data.workflow_runs.length < 100) {
                break;
              }
              page += 1;
            }

            if (!selectedRun) {
              core.setFailed(`No successful Build.yml run found for commit ${commitInput}.`);
              return;
            }

            core.info(`Using Build run ID ${selectedRun.id} (${selectedRun.html_url})`);
            core.setOutput("run_id", String(selectedRun.id));

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - resolve-build-run
    steps:
      - name: Download installer artifacts from Build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build-run.outputs.run_id }}
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          ls -R release-assets
          test -n "$(find release-assets -type f -name '*.msi' -print -quit)"
          test -n "$(find release-assets -type f -name '*.deb' -print -quit)"
          test -n "$(find release-assets -type f -name '*.rpm' -print -quit)"
          test -n "$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(needs.prepare-release.outputs.version, 'v') && needs.prepare-release.outputs.version || format('v{0}', needs.prepare-release.outputs.version) }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body: ${{ needs.prepare-release.outputs.release_description }}
          draft: ${{ needs.prepare-release.outputs.draft }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.msi
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.apk
            release-assets/**/*.dmg
